<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../bootstrap.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card" style="border-radius: 15px">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-uppercase text-center mb-5">Create an account</h2>

                        <form>
                            <div data-mdb-input-init class="form-outline mb-4">
                                <label class="form-label" for="form3Example1cg">Your Name</label>
                                <input type="text" id="form3Example1cg" class="form-control" required />
                            </div>

                            <div data-mdb-input-init class="form-outline mb-4">
                                <label class="form-label" for="form3Example3cg">Your Email</label>
                                <input type="email" id="form3Example3cg" class="form-control" required />
                            </div>

                            <div data-mdb-input-init class="form-outline">
                                <label class="form-label" for="form3Example4cg">Password</label>
                            </div>
                            <input type="password" id="form3Example4cg" class="form-control mb-4" required />

                            <div class="d-flex justify-content-center">
                                <button type="button" data-mdb-button-init data-mdb-ripple-init
                                    class="btn btn-primary btn-block gradient-custom-4 text-light">
                                    Login
                                </button>
                            </div>

                            <p class="text-center text-muted mt-4 mb-0">
                                Have already an account?
                                <a href="./signup.html" class="fw-bold text-primary"><u>signup here</u></a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="../bootstrap.js"></script>
    <script src="./login.js"></script>
</body>

</html>
